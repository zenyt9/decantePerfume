<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b4fd8"/>
      <stop offset="0.55" stop-color="#6d3ce0"/>
      <stop offset="1" stop-color="#8a2be2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.32" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7c789"/>
      <stop offset="1" stop-color="#b98f4e"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#dfe6ff" stop-opacity="0.65"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Text block -->
  <text x="90" y="250" font-family="Georgia, 'Times New Roman', serif" font-size="128" font-weight="600" fill="#ffffff">Décante</text>
  <rect x="94" y="286" width="132" height="5" rx="2.5" fill="url(#gold)"/>
  <text x="92" y="352" font-family="Arial, Helvetica, sans-serif" font-size="40" fill="#f2eefc">Ориг үнэртэй ус — жижиг савлагаагаар</text>

  <!-- Size chips -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#ffffff">
    <g>
      <rect x="92" y="392" width="92" height="52" rx="26" fill="#ffffff" fill-opacity="0.16"/>
      <text x="138" y="427" text-anchor="middle">5 мл</text>
    </g>
    <g>
      <rect x="196" y="392" width="104" height="52" rx="26" fill="#ffffff" fill-opacity="0.16"/>
      <text x="248" y="427" text-anchor="middle">10 мл</text>
    </g>
    <g>
      <rect x="312" y="392" width="104" height="52" rx="26" fill="#ffffff" fill-opacity="0.16"/>
      <text x="364" y="427" text-anchor="middle">20 мл</text>
    </g>
    <g>
      <rect x="428" y="392" width="104" height="52" rx="26" fill="#ffffff" fill-opacity="0.16"/>
      <text x="480" y="427" text-anchor="middle">50 мл</text>
    </g>
    <g>
      <rect x="544" y="392" width="120" height="52" rx="26" fill="#ffffff" fill-opacity="0.16"/>
      <text x="604" y="427" text-anchor="middle">100 мл</text>
    </g>
  </g>

  <text x="92" y="520" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#ffffff" letter-spacing="1">decanteperfume.com</text>

  <!-- Bottles -->
  <g transform="translate(820,150)">
    <!-- big bottle -->
    <rect x="70" y="8" width="70" height="30" rx="6" fill="url(#gold)"/>
    <rect x="86" y="34" width="38" height="26" fill="url(#gold)"/>
    <path d="M50 62 q55 -14 110 0 v220 a26 26 0 0 1 -26 26 h-58 a26 26 0 0 1 -26 -26 z" fill="url(#glass)"/>
    <rect x="70" y="150" width="70" height="86" rx="8" fill="#ffffff" fill-opacity="0.35"/>
    <!-- small decant vials -->
    <g transform="translate(-40,150)">
      <rect x="8" y="0" width="20" height="12" rx="3" fill="url(#gold)"/>
      <rect x="6" y="12" width="24" height="120" rx="10" fill="url(#glass)"/>
    </g>
    <g transform="translate(196,120)">
      <rect x="8" y="0" width="24" height="14" rx="3" fill="url(#gold)"/>
      <rect x="4" y="14" width="32" height="160" rx="12" fill="url(#glass)"/>
    </g>
  </g>
</svg>
