<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" width="2560" height="1440" role="img" aria-label="Décante — сонгосон үнэртэй уснууд">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf8f3"/>
      <stop offset="0.55" stop-color="#f4ead9"/>
      <stop offset="1" stop-color="#efdedf"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.66" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#e3c07f" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#e3c07f" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#e3c07f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2a2018" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2a2018" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ecce83"/><stop offset="1" stop-color="#b3862f"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d9bb4"/><stop offset="1" stop-color="#3c5a74"/>
    </linearGradient>
    <linearGradient id="gRose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d7a1ab"/><stop offset="1" stop-color="#9c626f"/>
    </linearGradient>
    <linearGradient id="gPink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eeb4c0"/><stop offset="1" stop-color="#c9808f"/>
    </linearGradient>
  </defs>

  <!-- Дэвсгэр -->
  <rect width="2560" height="1440" fill="url(#bg)"/>
  <ellipse cx="1690" cy="600" rx="1050" ry="820" fill="url(#glow)"/>

  <!-- Тавиур ба зөөлөн шал -->
  <rect x="0" y="1128" width="2560" height="312" fill="#e7d8c4" opacity="0.35"/>
  <rect x="0" y="1126" width="2560" height="3" fill="#cbb489" opacity="0.5"/>

  <!-- Гэрлийн тод цэгүүд -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="1180" cy="360" r="4"/><circle cx="2280" cy="300" r="5"/>
    <circle cx="2400" cy="620" r="3"/><circle cx="1120" cy="760" r="3"/>
    <circle cx="960" cy="520" r="3"/><circle cx="2200" cy="900" r="3"/>
  </g>
  <g fill="#c8a24e" opacity="0.5">
    <circle cx="1050" cy="450" r="3"/><circle cx="2320" cy="480" r="3"/><circle cx="1360" cy="300" r="3"/>
  </g>

  <!-- Сүүдэр -->
  <ellipse cx="1345" cy="1130" rx="180" ry="34" fill="url(#shadow)"/>
  <ellipse cx="1600" cy="1128" rx="160" ry="30" fill="url(#shadow)"/>
  <ellipse cx="1880" cy="1128" rx="150" ry="28" fill="url(#shadow)"/>
  <ellipse cx="2170" cy="1132" rx="185" ry="34" fill="url(#shadow)"/>

  <!-- ============ Флакон 1: Paco Rabanne · 1 Million (алт) ============ -->
  <g>
    <rect x="1250" y="690" width="230" height="410" rx="16" fill="url(#gGold)"/>
    <rect x="1250" y="690" width="230" height="410" rx="16" fill="none" stroke="#8a6522" stroke-opacity="0.35" stroke-width="2"/>
    <rect x="1274" y="718" width="40" height="330" rx="18" fill="#ffffff" opacity="0.22"/>
    <rect x="1300" y="640" width="130" height="52" rx="6" fill="#a97e2e"/>
    <rect x="1330" y="672" width="70" height="24" fill="#9c7530"/>
    <text x="1365" y="930" text-anchor="middle" font-family="Georgia, serif" font-size="120" fill="#ffffff" opacity="0.85">1M</text>
  </g>

  <!-- ============ Флакон 2: Dior · Sauvage (цэнхэр) ============ -->
  <g>
    <rect x="1520" y="628" width="200" height="472" rx="18" fill="url(#gBlue)"/>
    <rect x="1520" y="628" width="200" height="472" rx="18" fill="none" stroke="#2f4a63" stroke-opacity="0.35" stroke-width="2"/>
    <rect x="1542" y="656" width="34" height="380" rx="16" fill="#ffffff" opacity="0.20"/>
    <rect x="1568" y="578" width="104" height="54" rx="5" fill="#2f4a63"/>
    <rect x="1584" y="612" width="72" height="20" fill="#28405a"/>
    <text x="1620" y="900" text-anchor="middle" font-family="Georgia, serif" font-size="120" fill="#ffffff" opacity="0.82">D</text>
  </g>

  <!-- ============ Флакон 3: YSL · Libre (сарнай өнгө) ============ -->
  <g>
    <rect x="1800" y="648" width="176" height="452" rx="12" fill="url(#gRose)"/>
    <rect x="1800" y="648" width="176" height="452" rx="12" fill="none" stroke="#7f4d59" stroke-opacity="0.35" stroke-width="2"/>
    <rect x="1820" y="676" width="30" height="360" rx="14" fill="#ffffff" opacity="0.20"/>
    <rect x="1846" y="600" width="84" height="50" rx="4" fill="#20202a"/>
    <text x="1888" y="912" text-anchor="middle" font-family="Georgia, serif" font-size="104" fill="#ffffff" opacity="0.82">Y</text>
  </g>

  <!-- ============ Флакон 4: Lancôme · La Vie Est Belle (ягаан) ============ -->
  <g>
    <path d="M2055 806 q0 -66 55 -66 h120 q55 0 55 66 v210 q0 84 -115 84 q-115 0 -115 -84 z" fill="url(#gPink)"/>
    <path d="M2055 806 q0 -66 55 -66 h120 q55 0 55 66 v210 q0 84 -115 84 q-115 0 -115 -84 z" fill="none" stroke="#a5657a" stroke-opacity="0.35" stroke-width="2"/>
    <rect x="2078" y="762" width="26" height="248" rx="12" fill="#ffffff" opacity="0.22"/>
    <rect x="2140" y="700" width="30" height="46" fill="#c9808f"/>
    <rect x="2118" y="686" width="74" height="26" rx="6" fill="#d8a24e"/>
    <text x="2170" y="960" text-anchor="middle" font-family="Georgia, serif" font-size="108" fill="#ffffff" opacity="0.85">L</text>
  </g>

  <!-- ============ Декант жижиг сав (5/10/20мл) ============ -->
  <g>
    <!-- vial helper: цилиндр + таг -->
    <g>
      <rect x="1168" y="1012" width="40" height="104" rx="10" fill="#c9b48c"/>
      <rect x="1176" y="998" width="24" height="20" rx="4" fill="#9c8557"/>
      <rect x="1174" y="1024" width="8" height="70" rx="4" fill="#ffffff" opacity="0.35"/>
    </g>
    <g>
      <rect x="1476" y="1024" width="36" height="90" rx="9" fill="#8fa6bb"/>
      <rect x="1483" y="1011" width="22" height="18" rx="4" fill="#5f7891"/>
      <rect x="1482" y="1034" width="7" height="60" rx="3" fill="#ffffff" opacity="0.35"/>
    </g>
    <g>
      <rect x="1734" y="1028" width="34" height="86" rx="9" fill="#cf9fab"/>
      <rect x="1741" y="1016" width="20" height="16" rx="4" fill="#9c626f"/>
      <rect x="1740" y="1038" width="7" height="56" rx="3" fill="#ffffff" opacity="0.35"/>
    </g>
    <g>
      <rect x="2010" y="1020" width="40" height="100" rx="10" fill="#e0aab7"/>
      <rect x="2018" y="1006" width="24" height="20" rx="4" fill="#c9808f"/>
      <rect x="2016" y="1032" width="8" height="66" rx="4" fill="#ffffff" opacity="0.35"/>
    </g>
    <g>
      <rect x="2318" y="1030" width="34" height="84" rx="9" fill="#d8c48f"/>
      <rect x="2325" y="1018" width="20" height="16" rx="4" fill="#a9863a"/>
      <rect x="2324" y="1040" width="7" height="54" rx="3" fill="#ffffff" opacity="0.35"/>
    </g>
  </g>

  <!-- ============ Нэрсийн шошго ============ -->
  <g font-family="Georgia, serif" text-anchor="middle">
    <g>
      <text x="1365" y="1232" font-size="24" fill="#9a7a3f" letter-spacing="3">PACO RABANNE</text>
      <text x="1365" y="1268" font-size="34" fill="#2a2018">1 Million</text>
    </g>
    <g>
      <text x="1620" y="1232" font-size="24" fill="#3f5e78" letter-spacing="3">DIOR</text>
      <text x="1620" y="1268" font-size="34" fill="#2a2018">Sauvage</text>
    </g>
    <g>
      <text x="1888" y="1232" font-size="24" fill="#8a5563" letter-spacing="3">YVES SAINT LAURENT</text>
      <text x="1888" y="1268" font-size="34" fill="#2a2018">Libre</text>
    </g>
    <g>
      <text x="2170" y="1232" font-size="24" fill="#b5768a" letter-spacing="3">LANCÔME</text>
      <text x="2170" y="1268" font-size="34" fill="#2a2018">La Vie Est Belle</text>
    </g>
  </g>
</svg>
