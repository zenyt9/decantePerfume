<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" width="2560" height="1440" role="img" aria-label="Décante — сонгосон үнэртэй уснууд">
  <defs>
    <radialGradient id="glow" cx="0.66" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1a1030" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#1a1030" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2d68f"/><stop offset="1" stop-color="#b3862f"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fb0cc"/><stop offset="1" stop-color="#3c5a74"/>
    </linearGradient>
    <linearGradient id="gRose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2adb6"/><stop offset="1" stop-color="#9c626f"/>
    </linearGradient>
    <linearGradient id="gPink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6c1cc"/><stop offset="1" stop-color="#c9808f"/>
    </linearGradient>
  </defs>

  <!-- Гэрлийн зөөлөн туяа (флаконуудын ард) -->
  <ellipse cx="1720" cy="620" rx="980" ry="760" fill="url(#glow)"/>

  <!-- Тавиурын зөөлөн тусгал -->
  <rect x="900" y="1126" width="1660" height="3" fill="#ffffff" opacity="0.30"/>

  <!-- Гэрлийн тод цэгүүд -->
  <g fill="#ffffff" opacity="0.7">
    <circle cx="1180" cy="360" r="4"/><circle cx="2280" cy="300" r="5"/>
    <circle cx="2400" cy="620" r="3"/><circle cx="1120" cy="760" r="3"/>
    <circle cx="960" cy="520" r="3"/><circle cx="2200" cy="900" r="3"/>
    <circle cx="1050" cy="450" r="3"/><circle cx="2320" cy="480" r="3"/><circle cx="1360" cy="300" r="3"/>
  </g>

  <!-- Сүүдэр -->
  <ellipse cx="1345" cy="1130" rx="180" ry="34" fill="url(#shadow)"/>
  <ellipse cx="1600" cy="1128" rx="160" ry="30" fill="url(#shadow)"/>
  <ellipse cx="1880" cy="1128" rx="150" ry="28" fill="url(#shadow)"/>
  <ellipse cx="2170" cy="1132" rx="185" ry="34" fill="url(#shadow)"/>

  <!-- ============ Флакон 1: Paco Rabanne · 1 Million (алт) ============ -->
  <g>
    <rect x="1250" y="690" width="230" height="410" rx="16" fill="url(#gGold)"/>
    <rect x="1274" y="718" width="40" height="330" rx="18" fill="#ffffff" opacity="0.24"/>
    <rect x="1300" y="640" width="130" height="52" rx="6" fill="#c79a3f"/>
    <rect x="1330" y="672" width="70" height="24" fill="#b5872f"/>
    <text x="1365" y="930" text-anchor="middle" font-family="Georgia, serif" font-size="120" fill="#ffffff" opacity="0.9">1M</text>
  </g>

  <!-- ============ Флакон 2: Dior · Sauvage (цэнхэр) ============ -->
  <g>
    <rect x="1520" y="628" width="200" height="472" rx="18" fill="url(#gBlue)"/>
    <rect x="1542" y="656" width="34" height="380" rx="16" fill="#ffffff" opacity="0.24"/>
    <rect x="1568" y="578" width="104" height="54" rx="5" fill="#38536e"/>
    <rect x="1584" y="612" width="72" height="20" fill="#2f475f"/>
    <text x="1620" y="900" text-anchor="middle" font-family="Georgia, serif" font-size="120" fill="#ffffff" opacity="0.92">D</text>
  </g>

  <!-- ============ Флакон 3: YSL · Libre (сарнай өнгө) ============ -->
  <g>
    <rect x="1800" y="648" width="176" height="452" rx="12" fill="url(#gRose)"/>
    <rect x="1820" y="676" width="30" height="360" rx="14" fill="#ffffff" opacity="0.24"/>
    <rect x="1846" y="600" width="84" height="50" rx="4" fill="#2a2a36"/>
    <text x="1888" y="912" text-anchor="middle" font-family="Georgia, serif" font-size="104" fill="#ffffff" opacity="0.92">Y</text>
  </g>

  <!-- ============ Флакон 4: Lancôme · La Vie Est Belle (ягаан) ============ -->
  <g>
    <path d="M2055 806 q0 -66 55 -66 h120 q55 0 55 66 v210 q0 84 -115 84 q-115 0 -115 -84 z" fill="url(#gPink)"/>
    <rect x="2078" y="762" width="26" height="248" rx="12" fill="#ffffff" opacity="0.26"/>
    <rect x="2140" y="700" width="30" height="46" fill="#c9808f"/>
    <rect x="2118" y="686" width="74" height="26" rx="6" fill="#e0b45e"/>
    <text x="2170" y="960" text-anchor="middle" font-family="Georgia, serif" font-size="108" fill="#ffffff" opacity="0.92">L</text>
  </g>

  <!-- ============ Декант жижиг сав (5/10/20мл) ============ -->
  <g>
    <g>
      <rect x="1168" y="1012" width="40" height="104" rx="10" fill="#e8d6ad"/>
      <rect x="1176" y="998" width="24" height="20" rx="4" fill="#b89f6c"/>
      <rect x="1174" y="1024" width="8" height="70" rx="4" fill="#ffffff" opacity="0.4"/>
    </g>
    <g>
      <rect x="1476" y="1024" width="36" height="90" rx="9" fill="#aec3d6"/>
      <rect x="1483" y="1011" width="22" height="18" rx="4" fill="#7794ab"/>
      <rect x="1482" y="1034" width="7" height="60" rx="3" fill="#ffffff" opacity="0.4"/>
    </g>
    <g>
      <rect x="1734" y="1028" width="34" height="86" rx="9" fill="#e0b8c2"/>
      <rect x="1741" y="1016" width="20" height="16" rx="4" fill="#b5808d"/>
      <rect x="1740" y="1038" width="7" height="56" rx="3" fill="#ffffff" opacity="0.4"/>
    </g>
    <g>
      <rect x="2010" y="1020" width="40" height="100" rx="10" fill="#f2c3ce"/>
      <rect x="2018" y="1006" width="24" height="20" rx="4" fill="#d698a6"/>
      <rect x="2016" y="1032" width="8" height="66" rx="4" fill="#ffffff" opacity="0.4"/>
    </g>
    <g>
      <rect x="2318" y="1030" width="34" height="84" rx="9" fill="#ecd9a6"/>
      <rect x="2325" y="1018" width="20" height="16" rx="4" fill="#c1a25c"/>
      <rect x="2324" y="1040" width="7" height="54" rx="3" fill="#ffffff" opacity="0.4"/>
    </g>
  </g>

  <!-- ============ Нэрсийн шошго (цайвар) ============ -->
  <g font-family="Georgia, serif" text-anchor="middle">
    <g>
      <text x="1365" y="1232" font-size="24" fill="#ffffff" opacity="0.72" letter-spacing="3">PACO RABANNE</text>
      <text x="1365" y="1268" font-size="34" fill="#ffffff">1 Million</text>
    </g>
    <g>
      <text x="1620" y="1232" font-size="24" fill="#ffffff" opacity="0.72" letter-spacing="3">DIOR</text>
      <text x="1620" y="1268" font-size="34" fill="#ffffff">Sauvage</text>
    </g>
    <g>
      <text x="1888" y="1232" font-size="24" fill="#ffffff" opacity="0.72" letter-spacing="3">YVES SAINT LAURENT</text>
      <text x="1888" y="1268" font-size="34" fill="#ffffff">Libre</text>
    </g>
    <g>
      <text x="2170" y="1232" font-size="24" fill="#ffffff" opacity="0.72" letter-spacing="3">LANCÔME</text>
      <text x="2170" y="1268" font-size="34" fill="#ffffff">La Vie Est Belle</text>
    </g>
  </g>
</svg>
