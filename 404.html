<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Хуудас олдсонгүй · Décante</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root{ --bg:#0d0d0f; --surface:#16171b; --text:#f1eee7; --muted:#8b847a; --gold:#c9a84c; --gold-hi:#e3ca7f; --line:rgba(255,255,255,.1); }
    *{box-sizing:border-box}
    body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
      background:radial-gradient(700px 460px at 50% 0%, rgba(201,168,76,.13), transparent 60%), var(--bg);
      color:var(--text); font-family:"Inter",system-ui,sans-serif; -webkit-font-smoothing:antialiased; text-align:center; }
    .box{ max-width:460px }
    .mark{ width:44px; height:44px; border-radius:50%; margin:0 auto 26px;
      background:linear-gradient(140deg,var(--gold-hi),var(--gold) 55%,#8c6d3f);
      box-shadow:0 0 0 1px rgba(201,168,76,.4), 0 6px 20px rgba(201,168,76,.28); }
    .code{ font-family:"Cormorant Garamond",Georgia,serif; font-weight:600; font-size:96px; line-height:1; color:var(--gold-hi); margin:0 }
    h1{ font-family:"Cormorant Garamond",Georgia,serif; font-weight:600; font-size:30px; margin:6px 0 12px }
    p{ color:var(--muted); font-size:15.5px; line-height:1.6; margin:0 0 30px }
    a.btn{ display:inline-block; background:var(--gold); color:#16130a; font-weight:700; font-size:15px;
      text-decoration:none; padding:14px 30px; border-radius:100px; transition:background .2s; }
    a.btn:hover{ background:var(--gold-hi) }
    .sub{ margin-top:20px; font-size:13px; color:var(--muted) }
    .sub a{ color:var(--gold); text-decoration:none }
    .sub a:hover{ text-decoration:underline }
  </style>
</head>
<body>
  <div class="box">
    <div class="mark" aria-hidden="true"></div>
    <p class="code">404</p>
    <h1>Хуудас олдсонгүй</h1>
    <p>Уучлаарай, таны хайсан хуудас байхгүй эсвэл зөөгдсөн байна. Нүүр хуудаснаас дуртай үнэрээ үргэлжлүүлэн сонгоорой.</p>
    <a class="btn" href="/">Нүүр хуудас руу буцах</a>
    <p class="sub">Эсвэл <a href="/#products">бүтээгдэхүүн үзэх</a></p>
  </div>
</body>
</html>
